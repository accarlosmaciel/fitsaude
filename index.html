<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduSys — Sistema Escolar Acadêmico</title>
  <meta name="description" content="Sistema de gerenciamento escolar acadêmico com alunos, professores, disciplinas, cursos e matrículas.">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ══ Sidebar ══════════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">🎓</div>
        <div class="logo-text">
          <span class="logo-title">EduSys</span>
          <span class="logo-subtitle">Sistema Acadêmico</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard"
         id="nav-dashboard" onclick="navigate('dashboard'); return false;">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="alunos"
         id="nav-alunos" onclick="navigate('alunos'); return false;">
        <span class="nav-icon">🎓</span>
        <span>Alunos</span>
      </a>
      <a href="#" class="nav-item" data-page="professores"
         id="nav-professores" onclick="navigate('professores'); return false;">
        <span class="nav-icon">👨‍🏫</span>
        <span>Professores</span>
      </a>
      <a href="#" class="nav-item" data-page="cursos"
         id="nav-cursos" onclick="navigate('cursos'); return false;">
        <span class="nav-icon">📚</span>
        <span>Cursos</span>
      </a>
      <a href="#" class="nav-item" data-page="disciplinas"
         id="nav-disciplinas" onclick="navigate('disciplinas'); return false;">
        <span class="nav-icon">📖</span>
        <span>Disciplinas</span>
      </a>
      <a href="#" class="nav-item" data-page="matriculas"
         id="nav-matriculas" onclick="navigate('matriculas'); return false;">
        <span class="nav-icon">📋</span>
        <span>Matrículas</span>
      </a>
      <a href="#" class="nav-item" data-page="notas"
         id="nav-notas" onclick="navigate('notas'); return false;">
        <span class="nav-icon">📝</span>
        <span>Notas &amp; Frequência</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">A</div>
        <div class="user-info">
          <span class="user-name">Admin</span>
          <span class="user-role">Administrador</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ══ Main Wrapper ══════════════════════════════════════════ -->
  <div class="main-wrapper">

    <!-- Topbar -->
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" title="Menu">☰</button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-actions">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" placeholder="Buscar..." id="globalSearch">
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content" id="mainContent">
      <!-- Renderizado pelo app.js -->
    </main>

  </div>

  <!-- ══ Modal ═════════════════════════════════════════════════ -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal" id="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ══ Toast ══════════════════════════════════════════════════ -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
